openapi: 3.0.3
info:
  title: Stage B Ideas API
  description: |
    API for Stage B idea generation and management.

    Key features:
    - One-time idea generation per problem (no regeneration)
    - Automatic saving of generated ideas (paid content)
    - Bookmark/favorite functionality
    - Generation history
  version: 2.0.0
  contact:
    name: PPP Development Team

servers:
  - url: /api/ideas
    description: Ideas API base path

tags:
  - name: Generation
    description: Idea generation operations
  - name: Ideas
    description: Individual idea operations
  - name: Sessions
    description: Generation session history
  - name: Bookmarks
    description: Bookmark management

paths:
  /generate:
    post:
      summary: Generate ideas for a problem
      description: |
        Triggers AI agent to generate 3-5 business ideas for the selected problem.

        **One-time generation**: If ideas already exist for this problem, returns 409 Conflict
        with the existing session data.

        **Requires authentication and payment completion.**
      tags:
        - Generation
      operationId: generateIdeas
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateIdeasRequest'
      responses:
        '200':
          description: Ideas generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Problem not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ideas already generated for this problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResponse'
        '500':
          description: AI agent error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: AI agent unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: AI agent timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /problem/{problemId}/latest:
    get:
      summary: Get latest session for a problem
      description: Returns the most recent generation session for the specified problem
      tags:
        - Sessions
      operationId: getLatestSessionForProblem
      security:
        - bearerAuth: []
      parameters:
        - name: problemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No session found for this problem
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions:
    get:
      summary: List user's generation sessions
      description: Returns paginated list of user's generation history
      tags:
        - Sessions
      operationId: listSessions
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Sessions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions/{sessionId}:
    get:
      summary: Get session details
      description: Returns a specific generation session with all ideas
      tags:
        - Sessions
      operationId: getSession
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Access denied (not owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /{ideaId}/bookmark:
    patch:
      summary: Toggle bookmark status
      description: Toggles the bookmark status of an idea
      tags:
        - Bookmarks
      operationId: toggleBookmark
      security:
        - bearerAuth: []
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkRequest'
      responses:
        '200':
          description: Bookmark status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Access denied (not owner)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Idea not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bookmarked:
    get:
      summary: List bookmarked ideas
      description: Returns paginated list of user's bookmarked ideas
      tags:
        - Bookmarks
      operationId: listBookmarkedIdeas
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Bookmarked ideas list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeaListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Deprecated endpoints (kept for backwards compatibility)
  /{ideaId}/save:
    post:
      summary: Save an idea (DEPRECATED)
      description: |
        **DEPRECATED**: Use `PATCH /{ideaId}/bookmark` instead.

        This endpoint is maintained for backwards compatibility only.
      tags:
        - Ideas
      deprecated: true
      operationId: saveIdea
      security:
        - bearerAuth: []
      parameters:
        - name: ideaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveIdeaRequest'
      responses:
        '200':
          description: Idea saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedIdeaResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Already saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    GenerateIdeasRequest:
      type: object
      required:
        - problem_id
      properties:
        problem_id:
          type: string
          format: uuid
          description: ID of the problem from Stage A

    GenerationSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        problem_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PENDING, GENERATING, COMPLETED, FAILED]
        error_message:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        ideas:
          type: array
          items:
            $ref: '#/components/schemas/IdeaResponse'

    IdeaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        target_audience:
          type: string
        differentiators:
          type: array
          items:
            type: string
        market_opportunity:
          type: string
        implementation_hints:
          type: string
        is_bookmarked:
          type: boolean
        created_at:
          type: string
          format: date-time

    SessionListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GenerationSessionResponse'
        total:
          type: integer

    IdeaListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IdeaWithContextResponse'
        total:
          type: integer

    IdeaWithContextResponse:
      allOf:
        - $ref: '#/components/schemas/IdeaResponse'
        - type: object
          properties:
            problem_id:
              type: string
              format: uuid
            problem_title:
              type: string

    BookmarkRequest:
      type: object
      required:
        - is_bookmarked
      properties:
        is_bookmarked:
          type: boolean

    BookmarkResponse:
      type: object
      properties:
        idea_id:
          type: string
          format: uuid
        is_bookmarked:
          type: boolean

    ConflictResponse:
      type: object
      properties:
        detail:
          type: string
          example: "Ideas already generated for this problem"
        existing_session:
          $ref: '#/components/schemas/GenerationSessionResponse'

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string

    # Deprecated schemas
    SaveIdeaRequest:
      type: object
      properties:
        notes:
          type: string
          nullable: true
      deprecated: true

    SavedIdeaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        idea:
          $ref: '#/components/schemas/IdeaResponse'
        problem_id:
          type: string
          format: uuid
        problem_title:
          type: string
        notes:
          type: string
          nullable: true
        saved_at:
          type: string
          format: date-time
      deprecated: true
